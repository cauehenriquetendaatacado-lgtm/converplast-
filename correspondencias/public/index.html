<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Correspondências</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mut:#6b7686;--pri:#0b5fff;--ok:#118a4a;--warn:#c27a00;--bd:#dde3ec}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b1;--pri:#5b92ff;--ok:#3ecf8e;--warn:#f0b24a;--bd:#2a3542}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:16px 20px;background:var(--pri);color:#fff;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:grid;gap:4px}
input,select,textarea,button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:var(--pri);color:#fff;border:0;cursor:pointer}button.sec{background:var(--bd);color:var(--tx)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input,.tools select{flex:1;min-width:160px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-size:12px}
.b{padding:2px 8px;border-radius:99px;font-size:12px;white-space:nowrap}
.b.w{color:var(--warn);border:1px solid var(--warn)}.b.o{color:var(--ok);border:1px solid var(--ok)}
.stats{display:flex;gap:16px;color:var(--mut)}.stats b{color:var(--tx)}
.full{grid-column:1/-1}
#lk{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9}#lk .card{max-width:340px;display:grid;gap:10px;text-align:center}
@media print{header,form,.tools,button{display:none}}
</style></head><body>
<header><h1>📬 Gestor de Correspondências</h1><span style="display:flex;gap:16px"><span id="st" class="stats"></span><span id="tr" class="stats"></span></span></header>
<main>
<section class="card"><h3 style="margin-top:0">Registrar recebimento</h3>
<form id="f">
<label>Tipo<select name="tipo"><option>Encomenda</option><option>Carta</option><option>Documento</option><option>Malote</option><option>Outro</option></select></label>
<label>Remetente*<input name="remetente" required></label>
<label>Destinatário*<input name="destinatario" required list="nomes" autocomplete="off"></label>
<label>Setor / Loja<input name="setor"></label>
<label>Cód. rastreio / NF<input name="rastreio"></label>
<label>Recebido por*<input name="recebido_por" required list="nomes" autocomplete="off" placeholder="Digite seu nome"></label>
<label class="full">Descrição / Observação<input name="descricao"></label>
<div class="full"><button>Registrar</button></div>
</form></section>
<section class="card">
<div class="tools"><input id="q" placeholder="Buscar remetente, destinatário, rastreio..."><select id="s"><option value="">Todos</option><option>Aguardando retirada</option><option>Entregue</option></select><button class="sec" onclick="csv()">Exportar CSV</button><button class="sec" onclick="print()">Imprimir</button></div>
<div class="tw"><table><thead><tr><th>#</th><th>Recebido em</th><th>Tipo</th><th>Remetente</th><th>Destinatário</th><th>Setor</th><th>Rastreio</th><th>Recebido por</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</section></main>
<datalist id="nomes"></datalist><div id="lk"><div class="card"><h3 style="margin:0">🔒 Período de teste encerrado</h3><p style="color:var(--mut);margin:0">Informe a senha para liberar o aplicativo.</p><input id="pw" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')unlock()"><button onclick="unlock()">Desbloquear</button></div></div>
<script>
let D=[],K=localStorage.getItem('k')||'';
const $=s=>document.querySelector(s),fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){
  const r=await fetch('/api/'+u,{...o,headers:{'Content-Type':'application/json','x-access-key':K}});
  if(r.status===401){K=prompt('Chave de acesso:')||'';localStorage.setItem('k',K);return api(u,o)}
  const j=await r.json();if(r.status===402){lock();throw new Error(j.erro)}if(!r.ok)throw new Error(j.erro);return j}
function lock(){$('#lk').style.display='grid'}
async function unlock(){const r=await fetch('/api/licenca/desbloquear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:$('#pw').value})});const j=await r.json();if(!r.ok)return alert(j.erro);location.reload()}
fetch('/api/licenca').then(r=>r.json()).then(l=>{if(l.bloqueado)lock();else if(!l.desbloqueado)$('#tr').innerHTML=`Teste: <b>${l.restante} dia(s)</b>`})
async function load(){D=await api('correspondencias');render()}
function render(){
  $('#nomes').innerHTML=[...new Set(D.flatMap(x=>[x.destinatario,x.recebido_por]))].sort().map(n=>`<option value="${esc(n)}">`).join('');
  const q=$('#q').value.toLowerCase(),s=$('#s').value;
  const L=D.filter(x=>(!s||x.status===s)&&(!q||[x.remetente,x.destinatario,x.rastreio,x.setor,x.descricao].join(' ').toLowerCase().includes(q)));
  $('#tb').innerHTML=L.map(x=>`<tr><td>${x.id}</td><td>${fmt(x.recebido_em)}</td><td>${esc(x.tipo)}</td><td>${esc(x.remetente)}</td><td>${esc(x.destinatario)}</td><td>${esc(x.setor)}</td><td>${esc(x.rastreio)}</td><td>${esc(x.recebido_por)}</td>
  <td>${x.status==='Entregue'?`<span class="b o">Entregue</span><br><small>${esc(x.entregue_a)} · ${fmt(x.entregue_em)}<br>por ${esc(x.entregue_por)}</small>`:'<span class="b w">Aguardando retirada</span>'}</td>
  <td>${x.status==='Entregue'?'':`<button onclick="ent(${x.id})">Entregar</button>`}</td></tr>`).join('')||'<tr><td colspan=10>Nenhum registro.</td></tr>';
  const p=D.filter(x=>x.status!=='Entregue').length;
  $('#st').innerHTML=`Pendentes: <b>${p}</b> · Entregues: <b>${D.length-p}</b>`}
$('#f').onsubmit=async e=>{e.preventDefault();
  try{await api('correspondencias',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
  const r=e.target.recebido_por.value;localStorage.setItem('rp',r);e.target.reset();e.target.recebido_por.value=r;load()}catch(x){alert(x.message)}};
async function ent(id){
  const a=prompt('Nome de quem está retirando:');if(!a)return;
  const b=prompt('Quem está entregando (seu nome):');if(!b)return;
  try{await api(`correspondencias/${id}/entregar`,{method:'PATCH',body:JSON.stringify({entregue_a:a,entregue_por:b})});load()}catch(x){alert(x.message)}}
function csv(){
  const h=['id','tipo','remetente','destinatario','setor','rastreio','recebido_por','recebido_em','status','entregue_a','entregue_por','entregue_em'];
  const t=[h.join(';'),...D.map(x=>h.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='correspondencias.csv';a.click()}
$('#f').recebido_por.value=localStorage.getItem('rp')||'';$('#q').oninput=$('#s').onchange=render;load().catch(e=>{if(!/teste/.test(e.message))alert(e.message)});
</script></body></html>
